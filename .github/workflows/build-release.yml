name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to (blank = workflow artifacts only)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            format: msi
            python_cmd: python
            asset_glob: "dist/*.msi"
            artifact: kemonodownloader-windows
          - os: ubuntu-latest
            platform: linux
            format: appimage
            python_cmd: python3
            asset_glob: "dist/*.AppImage"
            artifact: kemonodownloader-linux
          - os: macos-latest
            platform: macos
            format: dmg
            python_cmd: python
            asset_glob: "dist/*.dmg"
            artifact: kemonodownloader-macos
    steps:
      - uses: actions/checkout@v4

      # Briefcase's Linux template must run under the system Python, so
      # setup-python is only used on Windows and macOS.
      - uses: actions/setup-python@v5
        if: matrix.platform != 'linux'
        with:
          python-version: "3.13"

      - name: Install Linux build prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-dev python3-venv \
            libegl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxkbcommon0 \
            libxcb-xinerama0 libpulse0 libpulse-mainloop-glib0 libasound2t64 \
            mesa-utils
          python3 -m pip install --user --break-system-packages --upgrade briefcase

      - name: Install Briefcase
        if: matrix.platform != 'linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase

      - name: Create, build and package
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          PY="${{ matrix.python_cmd }}"
          "$PY" -m briefcase create "${{ matrix.platform }}" --no-input
          "$PY" -m briefcase build "${{ matrix.platform }}" --no-input
          if [ "${{ matrix.platform }}" = "macos" ]; then
            # Ad-hoc signing keeps the unsigned build runnable on Apple silicon.
            "$PY" -m briefcase package "${{ matrix.platform }}" --no-input --adhoc-sign -p "${{ matrix.format }}"
          else
            "$PY" -m briefcase package "${{ matrix.platform }}" --no-input -p "${{ matrix.format }}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach artifacts to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          find artifacts -type f -print
          mapfile -t files < <(find artifacts -type f)
          gh release upload "$TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber
