name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the artifacts to (leave blank to only upload workflow artifacts)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msi
            os: windows-latest
            platform: windows
            format: ""
            package_args: "-p msi"
            asset: "dist/*.msi"
          - name: linux-deb
            os: ubuntu-24.04
            platform: linux
            format: system
            package_args: "-p deb"
            asset: "dist/*.deb"
    steps:
      - uses: actions/checkout@v4

      # Briefcase's Linux templates must run under the distro's system Python,
      # so setup-python is only used for the Windows build.
      - uses: actions/setup-python@v5
        if: matrix.platform == 'windows'
        with:
          python-version: "3.13"

      - name: Install Linux build prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-dev python3-venv \
            libegl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxkbcommon0 \
            libxcb-xinerama0 libpulse0 libpulse-mainloop-glib0 libasound2t64 \
            mesa-utils
          python3 -m pip install --user --break-system-packages --upgrade briefcase==0.4.7

      - name: Install Briefcase
        if: matrix.platform == 'windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase==0.4.7

      - name: Create and build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "linux" ]; then PY=python3; else PY=python; fi
          "$PY" -m briefcase create ${{ matrix.platform }} ${{ matrix.format }} --no-input
          "$PY" -m briefcase build ${{ matrix.platform }} ${{ matrix.format }} --no-input

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "linux" ]; then PY=python3; else PY=python; fi
          "$PY" -m briefcase package ${{ matrix.platform }} ${{ matrix.format }} --no-input ${{ matrix.package_args }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach artifacts to release
    needs: build
    # Attach whatever built, even if the other platform failed.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          files=$(find artifacts -type f)
          if [ -z "$files" ]; then
            echo "No artifacts were produced; nothing to upload."
            exit 1
          fi
          echo "$files"
          # shellcheck disable=SC2086
          gh release upload "$TAG" $files --repo "${{ github.repository }}" --clobber